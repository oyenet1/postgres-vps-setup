global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert.rules.yml

# ─── Built-in service scrapes ────────────────────────────────────
# The infra stack's own services. App scrapes are loaded dynamically
# from /etc/prometheus/targets/*.json (file_sd_configs below).
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # ─── Automatic Docker Swarm Service Discovery ──────────────────
  # Discovers any Swarm service connected to the 'infra' network automatically.
  # No manual JSON targets needed!
  - job_name: swarm-apps
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      # Only keep tasks connected to the 'infra' network
      - source_labels: [__meta_dockerswarm_network_name]
        regex: ".*infra.*"
        action: keep

      # Ignore internal infra stack services
      - source_labels: [__meta_dockerswarm_service_label_com_docker_stack_namespace]
        regex: "^infra.*$"
        action: drop

      # Metrics path: default to /v1/metrics (override with label prometheus.path or prometheus_path)
      - source_labels: [__meta_dockerswarm_service_label_prometheus_path]
        regex: "(.+)"
        target_label: __metrics_path__

      - source_labels: [__meta_dockerswarm_container_label_prometheus_path]
        regex: "(.+)"
        target_label: __metrics_path__

      - source_labels: [__metrics_path__]
        regex: "^/metrics$"
        target_label: __metrics_path__
        replacement: "/v1/metrics"

      # Port override if prometheus.port or prometheus_port label exists
      - source_labels: [__address__, __meta_dockerswarm_service_label_prometheus_port]
        regex: "([^:]+)(?::\\d+)?;(\\d+)"
        replacement: "$1:$2"
        target_label: __address__

      - source_labels: [__address__, __meta_dockerswarm_container_label_prometheus_port]
        regex: "([^:]+)(?::\\d+)?;(\\d+)"
        replacement: "$1:$2"
        target_label: __address__

      # Service name: extract from stack namespace (e.g. "lodgestatus")
      - source_labels: [__meta_dockerswarm_service_label_prometheus_service]
        regex: "(.+)"
        target_label: service

      - source_labels: [service, __meta_dockerswarm_service_label_com_docker_stack_namespace]
        regex: ";(.+)"
        target_label: service
        replacement: "$1"

      - source_labels: [service, __meta_dockerswarm_container_label_com_docker_stack_namespace]
        regex: ";(.+)"
        target_label: service
        replacement: "$1"

      # Environment: extract from app.env label or auto-detect from stack name
      - source_labels: [__meta_dockerswarm_service_label_app_env]
        regex: "(.+)"
        target_label: env

      - source_labels: [__meta_dockerswarm_container_label_app_env]
        regex: "(.+)"
        target_label: env

      - source_labels: [env, __meta_dockerswarm_service_label_com_docker_stack_namespace]
        regex: ";.*staging.*"
        target_label: env
        replacement: "staging"

      - source_labels: [env, __meta_dockerswarm_service_label_com_docker_stack_namespace]
        regex: ";(.+)"
        target_label: env
        replacement: "production"

      # Set job label to "apps" so Grafana queries match
      - target_label: job
        replacement: apps

  # ─── App scrapes (file_sd fallback) ─────────────────────────────
  - job_name: apps
    relabel_configs:
      - source_labels: [metrics_path]
        target_label:  __metrics_path__
      - source_labels: [scheme]
        target_label:  __scheme__
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.json
        refresh_interval: 30s
