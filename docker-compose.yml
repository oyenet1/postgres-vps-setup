x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

secrets:
  pgbouncer_userlist:
    file: ./pgbouncer/userlist.generated.txt

services:
  postgres:
    image: ${POSTGRES_IMAGE:-infra/postgres:latest}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGBOUNCER_AUTH_USER: ${PGBOUNCER_AUTH_USER:-pgbouncer_auth}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb/01-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
      - ./initdb/02-pgbouncer-auth.sh:/docker-entrypoint-initdb.d/02-pgbouncer-auth.sh:ro
      - ./postgres_config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres_config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      infra:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
      placement:
        constraints:
          - node.role == manager

  pgbouncer:
    image: edoburu/pgbouncer:${PGBOUNCER_IMAGE_TAG:-v1.25.1-p0}
    logging: *default-logging
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/pgbouncer-cert.pem:/etc/pgbouncer/server-cert.pem:ro
      - ./pgbouncer/pgbouncer-key.pem:/etc/pgbouncer/server-key.pem:ro
    ports:
      - target: 6432
        published: ${PGBOUNCER_PORT:-6543}
        protocol: tcp
        mode: host
    networks:
      infra:
        aliases:
          - pgbouncer
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    secrets:
      - source: pgbouncer_userlist
        target: /etc/pgbouncer/userlist.txt
        mode: 0444
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_IMAGE_TAG:-latest}
    logging: *default-logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - target: 80
        published: ${PGADMIN_PORT:-5050}
        protocol: tcp
        mode: host
    networks:
      infra:
        aliases:
          - pgadmin
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  redis-master:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
    volumes:
      - redis_master_data:/data
    networks:
      infra:
        aliases:
          - redis-master
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  redis-replica:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --replicaof
      - redis-master
      - "6379"
      - --appendonly
      - "yes"
      - --replica-read-only
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --masterauth
      - ${REDIS_PASSWORD}
    volumes:
      - redis_replica_data:/data
    networks:
      infra:
        aliases:
          - redis-replica
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  redis-sentinel:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    logging: *default-logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SENTINEL_MASTER_NAME: ${REDIS_SENTINEL_MASTER_NAME:-dbmaster}
    command: ["/bin/sh", "/redis/sentinel-entrypoint.sh"]
    volumes:
      - ./redis/sentinel-entrypoint.sh:/redis/sentinel-entrypoint.sh:ro
    networks:
      infra:
        aliases:
          - redis-sentinel
    deploy:
      mode: replicated
      replicas: 3
      restart_policy:
        condition: any

  redis-proxy:
    image: haproxy:${HAPROXY_IMAGE_TAG:-2.9-alpine}
    logging: *default-logging
    volumes:
      - ./redis/haproxy.generated.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - target: 6379
        published: ${REDIS_PORT:-6379}
        protocol: tcp
        mode: host
    networks:
      infra:
        aliases:
          - redis-proxy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6379"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  backup:
    image: ${INFRA_BACKUP_IMAGE:-infra/backup:latest}
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-2}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-43200}
      R2_BACKUP_ENABLED: ${R2_BACKUP_ENABLED:-false}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PREFIX: ${R2_PREFIX:-infra/}
      R2_MAX_BACKUPS_PER_DB: ${R2_MAX_BACKUPS_PER_DB:-2}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - backup_data:/backups
      - ./templates/backup.sh:/scripts/backup.sh:ro
      - ./config/rclone/rclone.generated.conf:/config/rclone/rclone.conf:ro
    command: ["/bin/sh", "-c", "while true; do /bin/sh /scripts/backup.sh; sleep ${BACKUP_INTERVAL_SECONDS:-43200}; done"]
    networks:
      - infra
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_IMAGE_TAG:-v0.17.1}
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=require"
    networks:
      infra:
        aliases:
          - postgres-exporter
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_IMAGE_TAG:-v1.63.0}
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis-proxy:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      infra:
        aliases:
          - redis-exporter
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_IMAGE_TAG:-v1.8.2}
    logging: *default-logging
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      infra:
        aliases:
          - node-exporter
    deploy:
      mode: global
      restart_policy:
        condition: any

  loki:
    image: grafana/loki:${LOKI_IMAGE_TAG:-3.0.0}
    logging: *default-logging
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - loki_data:/loki
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - target: 3100
        published: ${LOKI_PORT:-3100}
        protocol: tcp
        mode: host
    networks:
      infra:
        aliases:
          - loki
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  alloy:
    image: grafana/alloy:${ALLOY_IMAGE_TAG:-v1.8.3}
    logging: *default-logging
    command: run /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      infra:
        aliases:
          - alloy
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_IMAGE_TAG:-v0.27.0}
    logging: *default-logging
    volumes:
      - alertmanager_data:/alertmanager
      - ./monitoring/alertmanager.generated.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - target: 9093
        published: ${ALERTMANAGER_PORT:-9093}
        protocol: tcp
        mode: host
    networks:
      infra:
        aliases:
          - alertmanager
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

  prometheus:
    image: prom/prometheus:${PROMETHEUS_IMAGE_TAG:-v2.53.3}
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - target: 9090
        published: ${PROMETHEUS_PORT:-9090}
        protocol: tcp
        mode: host
    networks:
      infra:
        aliases:
          - prometheus
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager

  grafana:
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-11.2.0}
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - target: 3000
        published: ${GRAFANA_PORT:-3030}
        protocol: tcp
        mode: host
    networks:
      infra:
        aliases:
          - grafana
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

networks:
  infra:
    name: ${INFRA_NETWORK_NAME:-infra}
    external: true
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  redis_master_data:
  redis_replica_data:
  pgadmin_data:
  backup_data:
  loki_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
